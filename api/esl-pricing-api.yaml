openapi: "3.1.0"

info:
  title: ESL Pricing API
  version: "0.2.0"
  description: >
    Contract between the ESL Pricing Service and each store's gateway. The
    gateway (one per store, owned by the store team) polls /tags for its own
    store's desired state and reports back confirmations. It identifies its
    store with the X-Store-Key header issued when the store was created via
    POST /stores.

    This is the central-service side only. What the gateway does with a
    changed tag — how it drives the physical label hardware on its store's
    LAN — is a separate, store-local contract. See README.md.

servers:
  - url: /v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /catalog/variations:
    get:
      operationId: listVariations
      summary: List all catalog variations for tag assignment
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All known variations with parent item name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariationList"

  /stores:
    get:
      operationId: listStores
      summary: List all stores
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stores (api_key omitted — only returned once, on creation)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
    post:
      operationId: createStore
      summary: Register a new store
      description: >
        Returns the generated api_key exactly once. Hand it to that store's
        gateway operator to configure as the X-Store-Key header — it cannot
        be retrieved again afterward.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateBody"
      responses:
        "200":
          description: Store created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreWithKey"
        "400":
          description: id or square_location_id already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/tags:
    get:
      operationId: listTagsAdmin
      summary: List tags across all stores, for the admin dashboard
      description: >
        Gated by Auth0 login, not X-Store-Key — the dashboard isn't a
        gateway and has no per-store key; it authenticates the human
        instead. Optionally narrow to one store.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of tags, optionally filtered by store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"

  /tags:
    get:
      operationId: listTags
      summary: List all tags for the requesting store
      description: >
        The gateway polls this endpoint to discover which of its own store's
        tags need updating. X-Store-Key identifies the store; only that
        store's tags are returned. The gateway compares content_hash against
        what it last rendered; if different, it fetches and pushes the new
        content.
      security:
        - storeKey: []
      responses:
        "200":
          description: List of tags belonging to the authenticated store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "401":
          description: Missing or invalid X-Store-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags/{tag_id}:
    parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TagId"
    get:
      operationId: getTag
      summary: Get desired display state for a single tag
      description: Only returns the tag if it belongs to the authenticated store.
      security:
        - storeKey: []
      responses:
        "200":
          description: Tag desired state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: tag_id is not 12 hex characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid X-Store-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tag not found (or belongs to a different store)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: assignTag
      summary: Create or update a tag's store and variation assignment
      description: >
        Admin-dashboard action, gated by Auth0 login (not X-Store-Key).
        Creates the tag if it does not exist, owned by store_id. Pass
        variation_id to assign a catalog variation; pass null to unassign.
        A tag's store cannot be changed once set. content_hash is
        recomputed immediately so the gateway picks up the change on its
        next poll.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBody"
      responses:
        "200":
          description: Tag after assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: >
            tag_id is not 12 hex characters, or the tag already belongs to a
            different store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: store_id or variation_id not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags/{tag_id}/confirm:
    parameters:
      - name: tag_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/TagId"
    post:
      operationId: confirmTag
      summary: Gateway reports what it successfully rendered
      description: >
        Called by the gateway after it has pushed content to the physical
        tag. Only works for a tag belonging to the authenticated store. The
        service records the confirmation timestamp and battery level.
      security:
        - storeKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBody"
      responses:
        "204":
          description: Confirmation recorded
        "400":
          description: tag_id is not 12 hex characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid X-Store-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Tag not found (or belongs to a different store)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    storeKey:
      type: apiKey
      in: header
      name: X-Store-Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued access token, for the admin dashboard's own routes.

  schemas:
    TagId:
      type: string
      pattern: "^[0-9A-F]{12}$"
      description: >
        12-character hex tag identifier (matches the ESL hardware id).
        Case-insensitive on input, uppercase on output. Anything that is
        not 12 hex characters is rejected with 400.

    Store:
      type: object
      required: [id, name, square_location_id]
      properties:
        id:
          type: string
        name:
          type: string
        square_location_id:
          type: string
          description: Square location this store maps to, for resolving per-location price overrides

    StoreCreateBody:
      type: object
      required: [id, name, square_location_id]
      properties:
        id:
          type: string
        name:
          type: string
        square_location_id:
          type: string

    StoreWithKey:
      allOf:
        - $ref: "#/components/schemas/Store"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: Pass this as X-Store-Key. Shown only once.

    Tag:
      type: object
      required:
        - id
        - store_id
        - content_hash
      properties:
        id:
          $ref: "#/components/schemas/TagId"
        store_id:
          type: string
        variation_id:
          type: string
          nullable: true
          description: Square catalog variation ID this tag is assigned to
        name:
          type: string
          nullable: true
          description: Product name from the Square catalog
        variation_name:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: >
            Price in smallest currency unit (e.g. cents), resolved for this
            tag's store (Square location price overrides applied). Null
            when pricing_type is VARIABLE_PRICING — the gateway should
            render placeholder text (e.g. "<name> — See Register") for
            those, not a price template.
        pricing_type:
          type: string
          nullable: true
          enum: [FIXED_PRICING, VARIABLE_PRICING]
        content_hash:
          type: string
          nullable: true
          description: >
            SHA-256 of the canonical projection. The gateway uses this to detect
            drift without re-fetching every tag's full content on every poll.
            Null means the tag has no variation assigned — the gateway should
            show its unassigned screen rather than attempt to render product
            content. Every tag without a variation reports null here, whether
            it was never assigned or explicitly unassigned.
        last_pushed_at:
          type: string
          format: date-time
          nullable: true
        last_confirmed_at:
          type: string
          format: date-time
          nullable: true
        battery_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    TagList:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    Variation:
      type: object
      required:
        - id
        - item_id
        - name
        - variation_name
        - pricing_type
      properties:
        id:
          type: string
        item_id:
          type: string
        name:
          type: string
          description: Parent item name
        variation_name:
          type: string
        sku:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
          description: Price in cents. Null when VARIABLE_PRICING.
        pricing_type:
          type: string
          enum: [FIXED_PRICING, VARIABLE_PRICING]

    VariationList:
      type: object
      required:
        - variations
      properties:
        variations:
          type: array
          items:
            $ref: "#/components/schemas/Variation"

    AssignBody:
      type: object
      required: [store_id]
      properties:
        store_id:
          type: string
          description: Store this tag belongs to. Immutable once the tag is created.
        variation_id:
          type: string
          nullable: true
          description: Variation to assign. Null to unassign.

    ConfirmBody:
      type: object
      required:
        - content_hash
      properties:
        content_hash:
          type: string
          description: Hash of what was actually rendered, for drift detection
        battery_pct:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100

    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
