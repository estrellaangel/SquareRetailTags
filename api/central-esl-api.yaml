openapi: 3.1.0
info:
  title: Central ESL API
  version: 0.2.0
  description: |
    Contract used by each store Raspberry Pi to poll the central system for
    electronic shelf label work and report results.

    This is the store gateway's contract, authored by the store-side
    developer and implemented here. It coexists with the older /v1 gateway
    routes in esl-pricing-api.yaml (GET /tags, GET /tags/{id},
    POST /tags/{id}/confirm), which remain for the simulator and are not
    used by the real Pi.

    Sections covering Locate and telemetry are provisional/addendum behavior
    until confirmed by the central-system developer.

servers:
  - url: https://central-api.example.com
    description: Configure per environment

security:
  - StoreApiKey: []

paths:
  /api/label-updates/pending:
    get:
      summary: Fetch pending label work for a store
      description: |
        Returns commands whose central status is Pending, oldest first.
        Commands remain Pending until the Pi reports Accepted.
        Repeated delivery is expected and safe because updateId is idempotent.
      operationId: getPendingLabelUpdates
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
          example: STORE-001
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 200
          example: 200
      responses:
        "200":
          description: Pending work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingLabelUpdatesResponse"
        "403":
          description: API key is not authorized for the requested store

  /api/label-updates/status:
    post:
      summary: Report label-update statuses
      description: |
        Batched status reports from the Pi.

        The endpoint must be idempotent because the Pi retries after network
        failures and 5xx responses. The same (updateId, status) may arrive more
        than once and reports may arrive out of order.

        Apply a report only when statusAt is newer than the stored statusAt for
        that updateId. Within a single batch the reports are ordered
        oldest-first and may share one statusAt, so for equal timestamps the
        later array position wins; across batches the rule stays strictly
        newer-than.

        The batch is all or nothing. Either every report is acknowledged, or
        the batch is rejected and none of it is applied — a partial count
        would be uninterpretable, since the gateway cannot tell which of N
        reports a smaller number referred to.

        A duplicate or stale report is an acknowledged no-op, not a
        rejection, and so is a report for an updateId this service no longer
        holds. A Failed report is acknowledged exactly like a Succeeded one.
      operationId: reportLabelUpdateStatuses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusBatch"
      responses:
        "200":
          description: >
            Every report in the batch acknowledged. acceptedCount equals
            the number of reports submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCountResponse"
        "403":
          description: API key is not authorized for the requested store

  /api/labels/telemetry:
    post:
      summary: Report label and access-point telemetry
      description: |
        PROVISIONAL ADDENDUM.

        Telemetry is a snapshot, not an event stream. Repeated snapshots must
        be tolerated. Upsert labels by (storeId, tagId) and only apply label
        state when lastSeenAt is newer than the stored value (or the stored
        value is null).
      operationId: reportLabelTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryReport"
      responses:
        "200":
          description: Telemetry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedCountResponse"
        "403":
          description: API key is not authorized for the requested store

components:
  securitySchemes:
    StoreApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  schemas:
    PendingLabelUpdatesResponse:
      type: object
      required:
        - updates
        - hasMore
      properties:
        updates:
          type: array
          items:
            $ref: "#/components/schemas/LabelCommand"
        hasMore:
          type: boolean

    LabelCommand:
      oneOf:
        - $ref: "#/components/schemas/UpdateCommand"
        - $ref: "#/components/schemas/UnassignCommand"
        - $ref: "#/components/schemas/LocateCommand"
      discriminator:
        propertyName: action
        mapping:
          Update: "#/components/schemas/UpdateCommand"
          Unassign: "#/components/schemas/UnassignCommand"
          Locate: "#/components/schemas/LocateCommand"

    CommandBase:
      type: object
      required:
        - updateId
        - storeId
        - tagId
        - createdAt
      properties:
        updateId:
          type: string
          format: uuid
          description: Idempotency key. Never reuse for different content.
        storeId:
          type: string
          example: STORE-001
        tagId:
          type: string
          pattern: "^[0-9A-Fa-f]{12}$"
          description: Physical ESL tag identifier.
          example: "840001262D51"
        createdAt:
          type: string
          format: date-time
          description: UTC time when the central system created the command.

    UpdateCommand:
      allOf:
        - $ref: "#/components/schemas/CommandBase"
        - type: object
          required:
            - version
            - productId
            - display
          properties:
            action:
              type: string
              const: Update
              default: Update
              description: May be omitted; Update is the default.
            version:
              type: integer
              description: Strictly increasing per tagId. Higher version wins.
            productId:
              type: string
              description: Square catalog object ID, normally the variation ID.
            display:
              $ref: "#/components/schemas/ProductDisplay"

    UnassignCommand:
      allOf:
        - $ref: "#/components/schemas/CommandBase"
        - type: object
          required:
            - action
            - version
          properties:
            action:
              type: string
              const: Unassign
            version:
              type: integer
              description: Participates in the same per-label version ladder as Update.

    LocateCommand:
      allOf:
        - $ref: "#/components/schemas/CommandBase"
        - type: object
          required:
            - action
          properties:
            action:
              type: string
              const: Locate
            seconds:
              type: integer
              minimum: 1
              maximum: 65535
              default: 30
              description: |
                Requested LED flash duration. The Pi currently caps this at its
                configured maximum of 300 seconds.
            version:
              type:
                - integer
                - "null"
              description: Ignored for Locate; reports use null.

    ProductDisplay:
      type: object
      required:
        - itemName
        - price
      properties:
        itemName:
          type: string
          description: Square item name.
        variationName:
          type:
            - string
            - "null"
          description: Square variation name, including Regular when Square supplies it.
        price:
          $ref: "#/components/schemas/Money"
        sku:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
          description: Stored by the Pi but not rendered in v1.
        description:
          type:
            - string
            - "null"
          description: Stored by the Pi but not rendered in v1.

    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          description: Decimal string. Do not send JSON floating-point numbers.
          example: "219.99"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 currency code.
          example: USD

    StatusBatch:
      type: object
      required:
        - storeId
        - reports
      properties:
        storeId:
          type: string
          example: STORE-001
        reports:
          type: array
          items:
            $ref: "#/components/schemas/LabelUpdateStatusReport"

    LabelUpdateStatusReport:
      type: object
      required:
        - updateId
        - tagId
        - version
        - action
        - status
        - statusAt
        - attempt
      properties:
        updateId:
          type: string
          format: uuid
        tagId:
          type: string
          pattern: "^[0-9A-Fa-f]{12}$"
        version:
          type:
            - integer
            - "null"
          description: Null for Locate.
        action:
          type: string
          enum:
            - Update
            - Unassign
            - Locate
          description: PROVISIONAL ADDENDUM for all reports.
        status:
          type: string
          enum:
            - Accepted
            - Succeeded
            - Failed
            - Superseded
          description: |
            Only Accepted and final statuses cross the central/Pi boundary.
            Queued and SentToAp remain store-side diagnostics.
        statusAt:
          type: string
          format: date-time
        attempt:
          type: integer
          minimum: 1
        apId:
          type:
            - string
            - "null"
        failureCode:
          oneOf:
            - $ref: "#/components/schemas/FailureCode"
            - type: "null"
        failureMessage:
          type:
            - string
            - "null"
        retryable:
          type:
            - boolean
            - "null"
        diagnostics:
          oneOf:
            - $ref: "#/components/schemas/LabelDiagnostics"
            - type: "null"

    FailureCode:
      type: string
      enum:
        - LabelNoResponse
        - ApUnavailable
        - ApTimeout
        - ApQueueFull
        - LabelRejectedKey
        - LabelHardwareError
        - RenderError
        - InvalidCommand

    LabelDiagnostics:
      type: object
      properties:
        rfPower:
          type: integer
        battery:
          type: integer
        temperature:
          type: integer
        statusByte:
          type: integer
        lowBattery:
          type: boolean

    AcceptedCountResponse:
      type: object
      required:
        - acceptedCount
      properties:
        acceptedCount:
          type: integer
          minimum: 0
          description: >
            For /api/label-updates/status, the number of reports
            acknowledged — always equal to the number submitted, because
            the batch is all or nothing. It is NOT the number of database
            rows changed: duplicates and stale reports are acknowledged
            no-ops. The gateway may clear its outbox for the whole batch
            on a 200.

            For /api/labels/telemetry, the number of label and access
            point rows applied, which may legitimately be fewer than
            submitted when a snapshot is older than stored state.

    TelemetryReport:
      type: object
      required:
        - storeId
        - reportedAt
        - full
        - labels
        - accessPoints
      properties:
        storeId:
          type: string
        reportedAt:
          type: string
          format: date-time
        full:
          type: boolean
          description: True for the periodic full snapshot.
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelTelemetry"
        accessPoints:
          type: array
          items:
            $ref: "#/components/schemas/AccessPointTelemetry"

    LabelTelemetry:
      type: object
      required:
        - tagId
      properties:
        tagId:
          type: string
          pattern: "^[0-9A-Fa-f]{12}$"
        firstSeenAt:
          type: [string, "null"]
          format: date-time
        lastSeenAt:
          type: [string, "null"]
          format: date-time
        lastSeenApId:
          type: [string, "null"]
        rfPower:
          type: [integer, "null"]
        battery:
          type: [integer, "null"]
        lowBattery:
          type: [boolean, "null"]
        temperature:
          type: [integer, "null"]
        statusByte:
          type: [integer, "null"]
        firmwareVersion:
          type: [integer, "null"]
        type:
          type: [integer, "null"]
        size:
          type: [integer, "null"]
        color:
          type: [integer, "null"]
        factory:
          type: [integer, "null"]
        lastSuccessApId:
          type: [string, "null"]
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
        lastResultAt:
          type: [string, "null"]
          format: date-time
        lastResultSuccess:
          type: [boolean, "null"]

    AccessPointTelemetry:
      type: object
      required:
        - apId
        - connected
        - stale
      properties:
        apId:
          type: string
        connected:
          type: boolean
        stale:
          type: boolean
        connectedAt:
          type: [string, "null"]
          format: date-time
        disconnectedAt:
          type: [string, "null"]
          format: date-time
        lastHeartbeatAt:
          type: [string, "null"]
          format: date-time
        heartbeatIntervalSeconds:
          type: [integer, "null"]
        apVersion:
          type: [string, "null"]
        ip:
          type: [string, "null"]
        waitCount:
          type: [integer, "null"]
        sendCount:
          type: [integer, "null"]
